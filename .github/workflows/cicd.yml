name: Atelier CI/CD

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: atelier-flask

jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer les tests
        run: pytest -v tests

  Docker:
    runs-on: ubuntu-latest
    needs: Tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Exporter l'image dans un fichier
        run: docker save $IMAGE_NAME:${{ github.sha }} -o image.tar

      - name: Transmettre l'image au job suivant
        uses: actions/upload-artifact@v4
        with:
          name: image-docker
          path: image.tar

  # ---------------------------------------------------------------
  # JOB 3 - Déploiement continu : simulation de mise en production
  # ---------------------------------------------------------------
  # Objectif : "déployer" l'image et vérifier que l'application répond.
  #
  # Étapes à écrire :
  #   1. Récupérer l'image du job 2        -> action actions/download-artifact@v4
  #   2. Charger l'image dans Docker       -> docker load -i image.tar
  #   3. Démarrer le conteneur             -> docker run -d -p 4000:4000 ...
  #   4. Vérifier que l'application répond -> curl http://localhost:4000/
  #      (attention : l'application met quelques secondes à démarrer)
  #   5. Afficher un message de succès dans le résumé du pipeline
  #      -> echo "..." >> $GITHUB_STEP_SUMMARY
  Production:
    runs-on: ubuntu-latest
    needs: Docker
    environment: production
    steps:
      - name: A compléter
        run: |
          echo "Écrire ici la simulation de mise en production"
